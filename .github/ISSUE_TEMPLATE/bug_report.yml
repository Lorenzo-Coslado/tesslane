name: Bug report
description: Report a reproducible problem with the current application.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'For vulnerabilities, use the private reporting link in SECURITY.md. Remove credentials, private prompts and project paths from attachments.'
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example and whether this used sample data or a real provider.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Tesslane commit/version, OS, Node version, browser, engine and native CLI version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Include the useful error and relevant output; review attachments before sharing.
